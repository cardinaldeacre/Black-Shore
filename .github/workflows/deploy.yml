name: Black Shore CI/CD 🚀

on:
  push:
    branches:
      - master

jobs:
  deploy-backend:
    name: ⚡ Deploy Backend (Cloudflare)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Deploy to Cloudflare Workers
        run: cd apps/backend && bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  deploy-frontend:
    name: 🎨 Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Next.js Frontend
        run: cd apps/frontend && bun run build
        env:
          NEXT_PUBLIC_BACKEND_URL: https://black-shore-backend.cardinaldeacre.workers.dev
          
      - name: Deploy to Vercel
        run: bunx vercel deploy apps/frontend/out --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}